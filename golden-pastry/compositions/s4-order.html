<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-latin.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
        @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-latin-ext.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0100-024F, U+0259, U+1E00-1EFF; }
        @font-face { font-family: "Nunito Sans"; src: url("fonts/nunito-sans-latin.woff2") format("woff2"); font-weight: 400 800; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
        @font-face { font-family: "Nunito Sans"; src: url("fonts/nunito-sans-latin-ext.woff2") format("woff2"); font-weight: 400 800; unicode-range: U+0100-024F, U+0259, U+1E00-1EFF; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Nunito Sans", sans-serif; }
        .s4-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, #FFFBF3 0%, #F8F0E2 55%, #EBDDC6 100%); }
        .s4-stage { position: absolute; inset: 0; perspective: 1800px; }
        .s4-cap { position: absolute; left: 60px; right: 60px; top: 230px; text-align: center; font-weight: 800; font-size: 84px;
          line-height: 1.06; letter-spacing: -0.02em; color: #2B1D13; }
        .s4-cap .em { font-family: "Fraunces", serif; font-weight: 700; color: #C9561B; }
        #s4-cart { position: absolute; left: 780px; top: 1480px; width: 230px; height: 230px; }
        #s4-count { position: absolute; right: -6px; top: -6px; width: 92px; height: 92px; border-radius: 50%; background: #C9561B; color: #FFFBF3;
          font-weight: 800; font-size: 54px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 0 #7E2A0C; }
        .s4-plus { position: absolute; font-weight: 800; font-size: 56px; color: #3E9B5B; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s4-order" data-width="1080" data-height="1920">
        <div id="s4-bg" class="clip s4-bg" data-start="0" data-duration="20" data-track-index="0"></div>
        <div id="s4-stage" class="clip s4-stage" data-start="0" data-duration="20" data-track-index="1">
          <div id="s4-orbs"></div>
          <div id="s4-phonebox"></div>
          <div id="s4-cart"></div>
          <div id="s4-items"></div>
          <div id="s4-cap1" class="s4-cap"></div>
          <div id="s4-cap2" class="s4-cap"></div>
          <div id="s4-fx"></div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "s4-order", C = GP.C, $ = (s) => document.querySelector(s);
          const l10 = GP.line(ID, "10"), l11 = GP.line(ID, "11");
          const END = GP.sceneDur(ID);
          const tl = gsap.timeline({ paused: true });
          const fxl = $("#s4-fx");

          const orbs = [GP.orb($("#s4-orbs"), 110, 700, 100, "honey"), GP.orb($("#s4-orbs"), 980, 640, 70, "crust"), GP.orb($("#s4-orbs"), 120, 1690, 130, "cream")];
          tl.fromTo(orbs, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)", stagger: 0.06 }, 0.1);
          GP.bob(tl, orbs, 0.5, END - 0.5, { seed: 6 });

          // ---- phone with the real catalogue ----
          const ph = GP.phone($("#s4-phonebox"), 560, GP.scr("shop-catalog-frozen-full"), { css: "left:260px;top:560px;" });
          tl.fromTo(ph.el, { y: 1500, rotationX: 28, rotationY: -18, rotationZ: 6 }, { y: 0, rotationX: 0, rotationY: 0, rotationZ: 0, duration: 0.75, ease: "back.out(1.1)" }, 0.0);
          // flick-scroll down to the products (two strokes, like a thumb)
          tl.fromTo(ph.img, { y: 0 }, { y: -900, duration: 0.6, ease: "power3.out" }, l10.t + 0.55);
          tl.to(ph.img, { y: -1520, duration: 0.55, ease: "power3.out" }, l10.t + 1.35);
          GP.tap(tl, ph.el, 280, 900, l10.t + 0.5);
          GP.tap(tl, ph.el, 280, 900, l10.t + 1.3);

          const c1 = $("#s4-cap1"); c1.innerHTML = GP.t("l10");
          const w1 = GP.split(c1);
          GP.wordsIn(tl, w1, l10.t, { stagger: 0.06 });

          // ---- line 11: pick what you need — three products pop out into the basket ----
          GP.wordsOut(tl, w1, l11.t - 0.2);
          const c2 = $("#s4-cap2"); c2.innerHTML = GP.t("l11");
          const w2 = GP.split(c2);
          GP.wordsIn(tl, w2, l11.t);
          tl.to(ph.el, { x: -130, rotationY: 10, duration: 0.45, ease: "power3.inOut" }, l11.t - 0.2);

          // basket
          const cart = $("#s4-cart");
          const basket = GP.svg("svg", { viewBox: "0 0 200 200", width: 230, height: 230 }, cart);
          basket.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
          GP.svg("circle", { cx: 100, cy: 100, r: 100, fill: "#FFFBF3" }, basket);
          GP.svg("path", { d: "M40 82 L160 82 L146 156 Q144 166 134 166 L66 166 Q56 166 54 156 Z", fill: "#F2A63B", stroke: "#9A3610", "stroke-width": 7, "stroke-linejoin": "round" }, basket);
          GP.svg("path", { d: "M66 82 L88 40 M134 82 L112 40", stroke: "#9A3610", "stroke-width": 8, "stroke-linecap": "round", fill: "none" }, basket);
          GP.svg("path", { d: "M78 104 L78 144 M100 104 L100 144 M122 104 L122 144", stroke: "#C4741A", "stroke-width": 6, "stroke-linecap": "round" }, basket);
          cart.style.filter = "drop-shadow(0 18px 24px rgba(43,29,19,.3))";
          const count = GP.mk("div", "", cart, "", "");
          count.id = "s4-count";
          const nums = [0, 1, 2, 3].map((n) => GP.mk("span", "", count, "position:absolute;opacity:" + (n ? 0 : 1) + ";", String(n)));
          tl.fromTo(cart, { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)" }, l11.t - 0.1);

          const picks = [["assets/products/prod-7.jpg", 690], ["assets/products/prod-1.jpg", 900], ["assets/products/prod-13.jpg", 1110]];
          picks.forEach((p, i) => {
            const t0 = l11.t + 0.15 + i * 0.32;
            GP.tap(tl, ph.el, 400, 560 + i * 240, t0 - 0.05);
            const b = GP.badge($("#s4-items"), p[0], 230, { css: "left:740px;top:" + p[1] + "px;" });
            tl.fromTo(b, { x: -330, y: 60, scale: 0.2, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.9)" }, t0);
            const plus = GP.mk("div", "s4-plus", $("#s4-items"), "left:940px;top:" + (p[1] - 10) + "px;", "+1");
            tl.fromTo(plus, { y: 0, opacity: 0 }, { y: -70, opacity: 1, duration: 0.35, ease: "power2.out" }, t0 + 0.1);
            tl.to(plus, { opacity: 0, duration: 0.2 }, t0 + 0.5);
            // drop into the basket
            const tDrop = l11.t + 0.98 + i * 0.16;
            tl.to(b, { x: 25 + (i - 1) * 30, y: 1500 - p[1] + 10, scale: 0.36, duration: 0.42, ease: "power3.in" }, tDrop);
            tl.to(b, { opacity: 0, duration: 0.08 }, tDrop + 0.42);
            tl.to(nums[i], { opacity: 0, duration: 0.05 }, tDrop + 0.42);
            tl.fromTo(nums[i + 1], { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)", immediateRender: false }, tDrop + 0.42);
            tl.fromTo(basket, { scaleY: 1 }, { scaleY: 0.86, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.out", transformOrigin: "50% 100%", immediateRender: false }, tDrop + 0.42);
          });
          GP.sparkles(tl, fxl, 895, 1595, l11.t + 0.98 + 2 * 0.16 + 0.45, { n: 6, radius: 170, seed: 31 });

          // ---- exit: whip right with blur ----
          tl.to([ph.el, cart], { x: "+=1300", filter: "blur(18px)", duration: 0.4, ease: "power3.in", stagger: 0.03 }, END - 0.42);
          GP.wordsOut(tl, w2, END - 0.42);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
