<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-latin.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
        @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-latin-ext.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0100-024F, U+0259, U+1E00-1EFF; }
        @font-face { font-family: "Nunito Sans"; src: url("fonts/nunito-sans-latin.woff2") format("woff2"); font-weight: 400 800; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
        @font-face { font-family: "Nunito Sans"; src: url("fonts/nunito-sans-latin-ext.woff2") format("woff2"); font-weight: 400 800; unicode-range: U+0100-024F, U+0259, U+1E00-1EFF; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Nunito Sans", sans-serif; }
        .s7-bg { position: absolute; inset: 0; background: #FFF6E2; }
        .s7-stage { position: absolute; inset: 0; perspective: 1600px; }
        #s7-cold { position: absolute; left: 0; top: 0; bottom: 0; width: 540px; background: linear-gradient(180deg, #EAF7FF, #BFE6FF); }
        #s7-hot { position: absolute; right: 0; top: 0; bottom: 0; width: 540px; background: linear-gradient(180deg, #FFE9B8, #F7C46B); }
        .s7-cap { position: absolute; left: 40px; right: 40px; text-align: center; font-weight: 800; font-size: 110px; letter-spacing: -0.02em; color: #2B1D13; line-height: 1; }
        .s7-cap .em { font-family: "Fraunces", serif; font-weight: 700; color: #C9561B; }
        #s7-eq { position: absolute; left: 470px; top: 930px; width: 140px; height: 140px; border-radius: 50%; background: #FFFBF3; box-shadow: 0 12px 30px rgba(43,29,19,.25);
          display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 110px; color: #C9561B; line-height: 1; padding-bottom: 12px; }
        .s7-card { position: absolute; top: 760px; width: 440px; height: 480px; border-radius: 48px; }
      </style>
      <div id="root" data-composition-id="s7-same" data-width="1080" data-height="1920">
        <div id="s7-bg" class="clip s7-bg" data-start="0" data-duration="20" data-track-index="0"></div>
        <div id="s7-stage" class="clip s7-stage" data-start="0" data-duration="20" data-track-index="1">
          <div id="s7-cold"></div>
          <div id="s7-hot"></div>
          <div id="s7-world"></div>
          <div id="s7-eq">=</div>
          <div id="s7-c1" class="s7-cap" style="top:330px"></div>
          <div id="s7-c2" class="s7-cap" style="top:1420px"></div>
          <div id="s7-fx"></div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "s7-same", C = GP.C, $ = (s) => document.querySelector(s);
          const l = GP.line(ID, "18");
          const END = GP.sceneDur(ID);
          const tl = gsap.timeline({ paused: true });
          const world = $("#s7-world"), fxl = $("#s7-fx");

          // the two halves slide in from the warm white-out
          tl.fromTo("#s7-cold", { xPercent: -100 }, { xPercent: 0, duration: 0.4, ease: "power3.out" }, 0.0);
          tl.fromTo("#s7-hot", { xPercent: 100 }, { xPercent: 0, duration: 0.4, ease: "power3.out" }, 0.0);

          // twins: frozen left, baked right, book-open tilts toward each other
          const cardA = GP.mk("div", "s7-card", world, "left:50px;background:rgba(255,255,255,.55);border:6px solid rgba(255,255,255,.95);box-shadow:0 30px 60px rgba(62,143,209,.3);");
          const cardB = GP.mk("div", "s7-card", world, "left:590px;background:rgba(255,251,243,.6);border:6px solid #FFFBF3;box-shadow:0 30px 60px rgba(154,54,16,.3);");
          const fa = GP.croissant(cardA, 340, { frozen: true, css: "left:44px;top:110px;" });
          const fb = GP.croissant(cardB, 340, { css: "left:44px;top:110px;" });
          GP.flake(cardA, 70, "#7CC6F2", "left:340px;top:30px;");
          GP.flake(cardA, 44, "#7CC6F2", "left:40px;top:380px;");
          const fire = GP.svg("svg", { viewBox: "-60 -130 120 140", width: 70, height: 82 }, cardB);
          fire.style.cssText = "position:absolute;left:340px;top:28px;overflow:visible";
          GP.svg("path", { d: "M0 -125 C30 -85 58 -60 50 -28 C44 -4 24 6 0 6 C-24 6 -44 -4 -50 -28 C-58 -60 -30 -85 0 -125 Z", fill: "#C9561B" }, fire);
          GP.svg("path", { d: "M0 -80 C18 -58 32 -42 28 -20 C25 -6 14 0 0 0 C-14 0 -25 -6 -28 -20 C-32 -42 -18 -58 0 -80 Z", fill: "#FFE39A" }, fire);
          tl.fromTo(cardA, { x: -600, rotationY: 50 }, { x: 0, rotationY: 14, duration: 0.5, ease: "back.out(1.3)" }, 0.12);
          tl.fromTo(cardB, { x: 600, rotationY: -50 }, { x: 0, rotationY: -14, duration: 0.5, ease: "back.out(1.3)" }, 0.12);
          tl.fromTo("#s7-eq", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, l.t + l.d * 0.45);
          GP.ring(tl, fxl, 540, 1000, l.t + l.d * 0.45, { size: 200, color: C.honey, width: 10 });
          // both blink and smile at the same time: same recipe, same taste
          tl.fromTo([fa.eyes, fb.eyes], { scaleY: 1 }, { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1, ease: "none", transformOrigin: "50% 50%", immediateRender: false }, l.t + l.d * 0.6);
          tl.to([cardA, cardB], { rotationY: 0, duration: 0.5, ease: "power2.out" }, l.t + l.d * 0.5);

          const c1 = $("#s7-c1"); c1.innerHTML = GP.t("l18a");
          const c2 = $("#s7-c2"); c2.innerHTML = GP.t("l18b");
          GP.wordsIn(tl, GP.split(c1), l.t);
          GP.wordsIn(tl, GP.split(c2), l.t + l.d * 0.5);
          // hearts float up between them
          const hearts = [];
          for (let i = 0; i < 5; i++) {
            const h = GP.svg("svg", { viewBox: "0 0 100 90", width: 60 + i * 6, height: 54 + i * 5 }, fxl);
            h.style.cssText = "position:absolute;left:" + (470 + (i - 2) * 70) + "px;top:1120px;opacity:0;overflow:visible";
            GP.svg("path", { d: "M50 88 C20 66 0 48 0 26 C0 10 12 0 27 0 C38 0 46 6 50 14 C54 6 62 0 73 0 C88 0 100 10 100 26 C100 48 80 66 50 88 Z", fill: i % 2 ? "#E9814E" : "#D9433B" }, h);
            hearts.push(h);
          }
          tl.fromTo(hearts, { y: 0, opacity: 0, scale: 0.3 }, { y: -260, opacity: 1, scale: 1, duration: 0.7, ease: "power2.out", stagger: 0.07 }, l.t + l.d * 0.7);
          tl.to(hearts, { opacity: 0, duration: 0.25, stagger: 0.05 }, l.t + l.d * 0.7 + 0.6);

          // exit: wipe up to the next beat
          tl.to(["#s7-cold", "#s7-hot", "#s7-world", "#s7-eq", "#s7-c1", "#s7-c2"], { y: -1920, duration: 0.38, ease: "power3.in" }, END - 0.38);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
